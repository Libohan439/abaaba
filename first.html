<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>垃圾玩意</title>
    <style>
        body {
            transition: all 0.4s ease;
            display: flex;
            background: aliceblue;
            justify-content: center;
            align-content: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            transition: all 0.4s ease;
            gap: 12px;
            display: flex;
            flex-direction: column;
            background: aliceblue;
            justify-content: center;
            align-content: center;
            align-items: center;
            padding: 40px;
            width: auto;
            border: none;
        }

        .box h3 {
            transition: all 0.4s ease;
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #000000;
        }

        .box input {
            transition: all 0.4s ease;
            width: auto;
            min-width: 300px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .box button {
            transition: all 0.4s ease;
            width: 100%;
            min-width: 200px;
            padding: 12px;
            background: aqua;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .box button:hover {
            transition: all 0.4s ease;
            background: #3b5fdb;
            color: white !important;
        }
    </style>
</head>
<body>
<div class="box">
    <input type="password" id="Mrs_Deng" placeholder="please enter the passward">
    <button id="xiaobinbin"
            style="opacity: 0; pointer-events: none; transform: translateY(-10px); height: 0; margin: 0; padding: 0; border: 0; overflow: hidden;">
        start
    </button>
    <button id="SB_Laogailaoshi">unlock</button>
    <div id="beautiful_Miss_Lv"></div>
</div>
<script src="back1.js"></script>
</body>
</html>
